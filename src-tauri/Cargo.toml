[package]
name = "statscitizen"
version = "2.2.0"
description = "Next-Generation Star Citizen Live Telemetry, Flight & Financial Companion"
authors = ["StatsCitizen"]
edition = "2021"

[lib]
name = "statscitizen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
tonic = { version = "0.12", default-features = false, features = ["transport", "channel"] }
prost = "0.13"
prost-types = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
bytes = "1"
http = "1"
memchr = "2"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
dirs = "6"
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "query", "json"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Dev builds: optimize dependencies (regex, serde_json, prost…) so log indexing and gRPC
# decoding aren't 30-50x slower under `npm run dev`. Our own crate stays fast to rebuild.
[profile.dev.package."*"]
opt-level = 3
